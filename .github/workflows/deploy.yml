name: Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to deploy (e.g. 1.2.0) or "latest"'
        required: true
        default: 'latest'
        type: string
      environment:
        description: 'Railway environment'
        required: true
        default: 'production'
        type: string

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      RAILWAY_ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - name: Validate version
        run: |
          if [[ "$VERSION" != "latest" && ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be 'latest' or semver (e.g. 1.2.0)"
            exit 1
          fi

      - name: Validate environment
        run: |
          if [[ ! "$RAILWAY_ENVIRONMENT" =~ ^[a-zA-Z0-9_-]+$ ]]; then
            echo "Environment must be alphanumeric, dash, or underscore"
            exit 1
          fi

      - name: Compute image tag
        id: tag
        run: |
          if [[ "$VERSION" == "latest" ]]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Lowercase image name
        id: img
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify image exists on GHCR
        env:
          IMG: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:${{ steps.tag.outputs.tag }}
        run: |
          echo "Checking $IMG ..."
          docker manifest inspect "$IMG" > /dev/null
          echo "Image exists"

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway redeploy --service corner-company --environment "$RAILWAY_ENVIRONMENT" --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Summary
        env:
          IMG: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:${{ steps.tag.outputs.tag }}
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "Image: \`$IMG\`"
            echo "Environment: \`$RAILWAY_ENVIRONMENT\`"
          } >> "$GITHUB_STEP_SUMMARY"
